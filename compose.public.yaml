# Opt-in public gateway. Default compose.yaml remains loopback-only.
services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env to your DNS hostname}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./scripts/public/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.30.73.10
    depends_on:
      frontend:
        condition: service_healthy
  frontend:
    volumes:
      - ./scripts/public/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        ipv4_address: 172.30.73.11
  backend:
    environment:
      PUBLIC_WEB_URL: https://${SITE_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN}
      RATE_LIMIT_TRUSTED_PROXIES: 172.30.73.11
  model-worker:
    environment:
      PUBLIC_WEB_URL: https://${SITE_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN}
      RATE_LIMIT_TRUSTED_PROXIES: 172.30.73.11
  mysql:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  minio:
    restart: unless-stopped
  clamav:
    restart: unless-stopped
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.73.0/24
volumes:
  caddy_data:
  caddy_config:
