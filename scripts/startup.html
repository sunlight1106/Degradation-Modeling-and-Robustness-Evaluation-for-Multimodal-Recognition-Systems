<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>启动个人知识库</title>
<style>body{margin:0;background:#fafaf8;color:#26343c;font:16px/1.8 system-ui,sans-serif}main{max-width:720px;margin:14vh auto;padding:40px}small{letter-spacing:.12em;color:#7a868d}h1{font-size:32px;font-weight:600;margin:18px 0}ol{list-style:none;padding:0;margin:36px 0}li{padding:18px 0;border-bottom:1px solid #dfe5e8;color:#829098}li.active{color:#2e6789}li.done{color:#26343c}button,a{font:inherit;border:1px solid #d4dde1;background:white;border-radius:4px;padding:10px 22px;color:#2e6789;cursor:pointer;text-decoration:none;margin-right:12px}button:disabled{opacity:.4;cursor:default}#message{min-height:52px}#time{font-variant-numeric:tabular-nums}a[hidden]{display:none}</style>
<main><small>PERSONAL KNOWLEDGE / LOCAL STARTUP</small><h1>准备你的工作空间</h1><p>启动进度会在这里更新。首次安装需要下载组件，后续启动会复用已有服务。</p><ol><li id="docker">01　启动 Docker</li><li id="project">02　启动并检查项目服务</li><li id="ready">03　打开平台</li></ol><p id="message" role="status">准备启动…</p><p id="time"></p><button id="retry" disabled>重试启动</button><a id="open" hidden target="_blank" rel="noopener">进入平台 →</a></main>
<script>const token='__TOKEN__';let start=Date.now(),polling=false,finished=null;const $=id=>document.getElementById(id);async function poll(){if(polling)return;polling=true;try{const r=await fetch('/status');if(!r.ok)throw Error();const s=await r.json();$('message').textContent=s.phase;$('retry').disabled=s.state!=='failed';$('docker').className=s.step==='docker'?'active':s.step?'done':'';$('project').className=s.step==='project'?'active':s.state==='ready'?'done':'';$('ready').className=s.state==='ready'?'done':'';if(s.state==='ready'&&/^http:\/\/localhost:\d{1,5}$/.test(s.url)){$('open').href=s.url;$('open').hidden=false}if(s.state==='ready'||s.state==='failed')finished??=Date.now();$('time').textContent='已等待 '+Math.floor(((finished??Date.now())-start)/1000)+' 秒'}catch{$('message').textContent='启动进度暂时断开。请检查启动进程。'}finally{polling=false}}$('retry').onclick=async()=>{$('retry').disabled=true;const r=await fetch('/retry',{method:'POST',headers:{'X-Launcher-Token':token}});if(r.ok){start=Date.now();finished=null;$('open').hidden=true}await poll()};poll();setInterval(poll,1500)</script></html>
