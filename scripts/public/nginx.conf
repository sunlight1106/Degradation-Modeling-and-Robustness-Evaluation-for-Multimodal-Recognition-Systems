# Do not record request URLs: share and payment tokens are bearer secrets in paths.
log_format privacy '$remote_addr [$time_local] "$request_method" $status $body_bytes_sent';
error_log /var/log/nginx/error.log crit;

server {
    # Override the parent http-level combined log rather than add a second log beside it.
    access_log /var/log/nginx/access.log privacy;
    client_max_body_size 105m;
    listen 80;
    server_name _;
    # Only the fixed Caddy gateway may supply the visitor IP; untrusted headers are ignored.
    set_real_ip_from 172.30.73.10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        # 保留端口号：浏览器对 POST 总会带 Origin 头，若 Host 丢失端口，后端会把
        # 同源请求误判为跨域（Origin 含端口而 Host 不含）并被 CORS 拒绝为 403。
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 接口文档与 OpenAPI 描述：后端 8080 不对外暴露，经此同源代理访问
    location ~ ^/(swagger-ui|v3/api-docs|swagger-ui\.html) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
